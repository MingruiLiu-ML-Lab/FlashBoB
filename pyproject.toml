[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "flashbob"
version = "0.0.1"
description = "Second-order scaled dot-product attention for PyTorch with Triton CUDA kernels"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.8,<2.10",
    "triton>=3.4,<3.6",
]

[project.optional-dependencies]
native = ["flash-attn>=2.8,<2.9"]
test = ["pytest>=8,<10"]
benchmarks = [
    "datasets>=4.8,<5",
    "matplotlib>=3.10,<4",
    "numpy>=2.1,<3",
    "tiktoken>=0.12,<1",
    "transformers>=5.5,<5.6",
    "wandb>=0.25,<0.26",
]
flashback = ["dill", "jax[cuda12]", "tqdm"]
modal = ["modal>=1.5,<2"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["bob", "bob.kernels"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
